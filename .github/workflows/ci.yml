name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shopboard-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name shopboard-test -p 8000:8000 \
            -e APP_DEBUG=true \
            -e LOG_CHANNEL=stderr shopboard-ci:latest
          sleep 4
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000)
          echo "HTTP: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "=== Docker Logs ==="
            docker logs shopboard-test 2>&1 | tail -50
          fi
          docker stop shopboard-test
          [ "$STATUS" = "200" ]
