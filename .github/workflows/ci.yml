name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shopboard-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name shopboard-test -p 8000:8000 \
            -e APP_DEBUG=true shopboard-ci:latest
          sleep 4
          # Get the error page and extract the exception message
          curl -s http://localhost:8000 | grep -oP '(?<=<title>)[^<]+' | head -1
          echo "---"
          curl -s http://localhost:8000 | grep -oP '(?<=class="break-words">)[^<]{1,200}' | head -5
          echo "---"
          # Check Laravel log
          docker exec shopboard-test cat storage/logs/laravel.log 2>/dev/null | tail -50 || echo "no log file"
          docker stop shopboard-test
