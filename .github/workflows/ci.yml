name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shopboard-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name shopboard-test -p 8000:8000 \
            -e APP_DEBUG=true shopboard-ci:latest
          sleep 4
          curl -s http://localhost:8000 | \
            python3 -c "
import sys, re, html
for line in sys.stdin:
    m = re.search(r'break-words[^>]*>(.+?)</', line)
    if m:
        print(html.unescape(re.sub(r'<[^>]+>', '', m.group(1))))
" > /tmp/error.txt 2>/dev/null || true
          echo "=== Exception ==="
          head -5 /tmp/error.txt || echo '(no match)'
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000)
          echo "HTTP: $STATUS"
          docker stop shopboard-test
          [ "$STATUS" = "200" ]
