name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shopboard-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name shopboard-test -p 8000:8000 \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e SESSION_DRIVER=file \
            -e DB_CONNECTION=sqlite \
            shopboard-ci:latest
          sleep 5
          # Check container is running
          docker ps | grep shopboard-test
          # Check HTTP response
          HTTP_CODE=$(curl -s -o /tmp/response.html -w '%{http_code}' http://localhost:8000 || true)
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Smoke test PASSED"
          else
            echo "--- Response body (first 2000 chars) ---"
            head -c 2000 /tmp/response.html
            echo ""
            echo "--- Container logs ---"
            docker logs shopboard-test 2>&1 | tail -30
            echo "Smoke test FAILED with HTTP $HTTP_CODE"
            exit 1
          fi
          docker stop shopboard-test || true
