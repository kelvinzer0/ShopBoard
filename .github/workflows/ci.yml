name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shopboard-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name shopboard-test -p 8000:8000 shopboard-ci:latest
          for i in $(seq 1 10); do
            sleep 2
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "ShopBoard is up! HTTP $STATUS"
              docker stop shopboard-test
              exit 0
            fi
          done
          echo "FAIL: HTTP $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000)"
          docker logs shopboard-test
          docker stop shopboard-test
          exit 1
