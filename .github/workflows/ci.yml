name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shopboard-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name shopboard-test -p 8000:8000 \
            -e APP_ENV=production \
            -e APP_DEBUG=true \
            -e APP_URL=http://localhost:8000 \
            -e SESSION_DRIVER=file \
            -e DB_CONNECTION=sqlite \
            shopboard-ci:latest
          sleep 5
          # Check container is running
          docker ps | grep shopboard-test
          # Check HTTP response
          HTTP_CODE=$(curl -s -o /tmp/response.html -w '%{http_code}' http://localhost:8000 || true)
          echo "HTTP status: $HTTP_CODE"
          # Check if response contains expected page content
          if grep -q 'ShopBoard' /tmp/response.html 2>/dev/null; then
            echo "Smoke test PASSED (page renders with ShopBoard content)"
          else
            echo "--- Response body (first 3000 chars) ---"
            head -c 3000 /tmp/response.html
            echo ""
            echo "--- Container logs ---"
            docker logs shopboard-test 2>&1 | tail -40
            echo "Smoke test FAILED - no ShopBoard content in response"
            exit 1
          fi
          docker stop shopboard-test || true
