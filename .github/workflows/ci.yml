name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shopboard-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name shopboard-test -p 8000:8000 \
            -e APP_DEBUG=true shopboard-ci:latest
          sleep 4
          STATUS=$(curl -s -o /tmp/resp.html -w '%{http_code}' http://localhost:8000 || echo "000")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "=== Error title ==="
            grep -oP '(?<=<title>)[^<]+' /tmp/resp.html | head -1
            echo "=== Error message ==="
            grep -oP '(?<=<h1[^>]*>)[^<]+|(?<=<p class="break-words">)[^<]{1,300}' /tmp/resp.html | head -10
            echo "=== Laravel log ==="
            docker exec shopboard-test cat storage/logs/laravel.log 2>/dev/null | tail -30 || true
          fi
          docker stop shopboard-test
          [ "$STATUS" = "200" ]
