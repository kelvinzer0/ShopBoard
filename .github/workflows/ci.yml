name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shopboard-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name shopboard-test -p 8000:8000 \
            -e APP_DEBUG=true shopboard-ci:latest
          echo "Waiting for server..."
          for i in $(seq 1 10); do
            sleep 2
            STATUS=$(curl -s -o /tmp/response.html -w '%{http_code}' http://localhost:8000 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" != "000" ]; then
              echo "=== Response body ==="
              cat /tmp/response.html | head -50
              echo "=== Container logs ==="
              docker logs shopboard-test 2>&1 | tail -30
              if [ "$STATUS" = "200" ]; then
                echo "SUCCESS"
                docker stop shopboard-test
                exit 0
              else
                echo "FAIL: HTTP $STATUS"
                docker stop shopboard-test
                exit 1
              fi
            fi
          done
          echo "FAIL: Server never responded"
          docker logs shopboard-test
          docker stop shopboard-test
          exit 1
